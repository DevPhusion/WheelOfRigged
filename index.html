<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of Names</title>
<meta name="description" content="Add names, spin the wheel, get a winner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="site-header">
    <h1 id="siteTitle" class="site-title">Wheel of Names</h1>
    <p class="subtitle">Add names, spin the wheel, get a winner.</p>
  </header>

  <main class="layout">
    <section class="wheel-section">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheelCanvas" width="520" height="520"></canvas>
      </div>
      <button id="spinBtn" class="spin-btn" type="button">Spin</button>
    </section>

    <section class="names-section">
      <h2>Names</h2>

      <form id="addNameForm" class="add-name-form">
        <label for="nameInput" class="visually-hidden">Add a name</label>
        <input id="nameInput" type="text" placeholder="Add a name…" autocomplete="off">
        <button type="submit">Add</button>
      </form>

      <label for="bulkNames" class="visually-hidden">Paste multiple names, one per line</label>
      <textarea id="bulkNames" rows="3" placeholder="Or paste a list, one name per line…"></textarea>
      <button id="bulkAddBtn" type="button" class="secondary-btn full-width">Add all</button>

      <ul id="namesList" class="names-list" aria-label="Current names"></ul>

      <button id="clearNamesBtn" type="button" class="secondary-btn full-width">Clear all</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>Runs entirely in your browser — nothing is sent anywhere.</p>
  </footer>
</div>

<!-- Winner reveal -->
<div id="winnerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winnerHeading">
  <div class="modal-content">
    <h2 id="winnerHeading">We have a winner</h2>
    <p id="winnerName" class="winner-name"></p>
    <button id="closeWinnerBtn" type="button">Close</button>
  </div>
</div>

<!-- Hidden advanced options panel (not linked anywhere in the visible UI) -->
<div id="advancedPanel" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="advancedHeading">
  <div class="modal-content advanced-content">
    <h2 id="advancedHeading">Advanced Options</h2>

    <label class="opt-row">
      <span>Spin duration (seconds)</span>
      <input id="spinDuration" type="number" min="2" max="15" value="6">
    </label>

    <label class="opt-row checkbox-row">
      <span>Enable tick sound</span>
      <input id="soundToggle" type="checkbox" checked>
    </label>

    <label class="opt-row checkbox-row">
      <span>Confetti on winner</span>
      <input id="confettiToggle" type="checkbox" checked>
    </label>

    <hr>

    <label class="opt-row checkbox-row">
      <span>Enable advanced randomization engine</span>
      <input id="rigToggle" type="checkbox">
    </label>

    <label class="opt-block">
      <span>Custom seed entries (one per line)</span>
      <textarea id="rigNames" rows="4" placeholder="e.g. Alex"></textarea>
    </label>
    <p class="advanced-hint">Custom seed entries only take effect for names that are also in the main list.</p>

    <div class="advanced-actions">
      <button id="closeAdvancedBtn" type="button" class="secondary-btn">Close</button>
      <button id="saveAdvancedBtn" type="button">Save</button>
    </div>
  </div>
</div>

<canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

<script src="script.js"></script>
</body>
</html>
